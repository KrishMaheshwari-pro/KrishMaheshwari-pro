# ─────────────────────────────────────────────────────────────────────────────
#  Contribution Snake 🐍
#  Generates an animated SVG of a snake eating your contribution graph and
#  publishes it to the `output` branch, where the README references it.
#
#  Why a separate branch? It keeps generated binaries out of `main`, so your
#  history stays clean and the README's raw.githubusercontent URLs stay stable.
#
#  First run: Actions tab → "Contribution Snake" → Run workflow.
#  After that it self-updates every 12h and on every push to main.
# ─────────────────────────────────────────────────────────────────────────────
name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches:
      - main

# Least-privilege: only allow writing repo contents (to push the output branch)
permissions:
  contents: write

# If two runs overlap, cancel the older one — we only ever want the latest snake
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Two palettes so the README's <picture> can serve the right one per theme
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=8B5CF6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=22D3EE&color_dots=#0e1530,#1f3b6b,#2e5bff,#6b8cff,#22d3ee

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
