# ─────────────────────────────────────────────────────────────────────────────
#  Contribution Snake 🐍
#  Generates an animated SVG of a snake eating your contribution graph and
#  publishes it to the `output` branch, where the README references it.
#
#  Why a separate branch? It keeps generated binaries out of `main`, so your
#  history stays clean and the README's raw.githubusercontent URLs stay stable.
#
#  First run: Actions tab → "Contribution Snake" → Run workflow.
#  After that it self-updates every 12h and on every push to main.
# ─────────────────────────────────────────────────────────────────────────────
name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches:
      - main

# Least-privilege: only allow writing repo contents (to push the output branch)
permissions:
  contents: write

# If two runs overlap, cancel the older one — we only ever want the latest snake
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # ONE high-contrast, colourful snake that reads on BOTH GitHub themes.
          # color_dots is a 5-stop ramp: empty cells use a visible slate so the
          # contribution grid never disappears on a dark background; filled cells
          # ramp blue → purple → magenta → cyan. Snake itself is bright cyan.
          outputs: |
            dist/github-snake.svg?color_snake=#22d3ee&color_dots=#27314f,#3b82ff,#8b5cf6,#e15fd0,#22d3ee

      # Publish with plain git instead of a third-party action — avoids the
      # Node 20 deprecation warning and keeps the toolchain future-proof.
      # The snk step is a Docker action, so it writes dist/ as root; we reclaim
      # ownership and mark the dir safe so git won't reject it. Each run then
      # force-pushes a single fresh commit to the `output` branch (it only
      # holds generated SVGs, so history is disposable).
      - name: Publish to the output branch
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          git init -q
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: update contribution snake [skip ci]"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
