<?xml version="1.0" encoding="UTF-8"?>
<!-- TECH STACK · animated floating pill grid, mirrors the stack on krishmaheshwari.vercel.app.
     Self-contained (no external logos / network requests). Each pill gently floats + glows
     on a staggered delay so the whole grid ripples. Dark card on transparent canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img"
     aria-label="Tech stack: HTML, CSS, JavaScript, C, C++, Python, Go, MongoDB, ReactJS, Node.js, Supabase, Firebase, SQL, Excel, AWS, Power BI, Tableau, Docker, MySQL">
  <defs>
    <linearGradient id="tsg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1024"/><stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="tsg_rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E5BFF" stop-opacity="0"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity=".85"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tsg_spk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h{font-family:'Segoe UI',system-ui,sans-serif}
      /* pills are visible by default (opacity 1); animation only adds a gentle float + glow,
         so nothing disappears if a renderer skips animation. Staggered via inline delay. */
      .pill{animation:floatGlow 3.6s ease-in-out infinite}
      @keyframes floatGlow{0%,100%{transform:translateY(0);filter:brightness(1)}50%{transform:translateY(-3px);filter:brightness(1.2)}}
      .dot{animation:dotPulse 3.6s ease-in-out infinite;transform-origin:center}
      @keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
      @media (prefers-reduced-motion:reduce){.pill,.dot{animation:none}}
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="356" rx="22" fill="url(#tsg_bg)" stroke="#1E2A45" stroke-width="1.5"/>

  <!-- header -->
  <text class="h" x="36" y="50" fill="#F4F7FF" font-size="24" font-weight="800" letter-spacing="-.5">Tech Stack</text>
  <text class="h" x="36" y="74" fill="#7E8BA8" font-size="14">The languages, tools and platforms I build with day to day.</text>
  <line x1="36" y1="90" x2="1064" y2="90" stroke="url(#tsg_rule)" stroke-width="1.5"/>
  <circle cx="0" cy="90" r="7" fill="url(#tsg_spk)">
    <animate attributeName="cx" values="90;1010;90" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </circle>

  <!-- ── Pill grid (5 per row · 4 rows · 19 techs) ───────────── -->
  <!-- Row 1 -->
  <g transform="translate(30,104)"><g class="pill" style="animation-delay:0s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#3B82FF"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">HTML</text></g></g>
  <g transform="translate(242,104)"><g class="pill" style="animation-delay:.15s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#22D3EE"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">CSS</text></g></g>
  <g transform="translate(454,104)"><g class="pill" style="animation-delay:.3s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#8B5CF6"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">JavaScript</text></g></g>
  <g transform="translate(666,104)"><g class="pill" style="animation-delay:.45s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#E15FD0"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">C</text></g></g>
  <g transform="translate(878,104)"><g class="pill" style="animation-delay:.6s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#3B82FF"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">C++</text></g></g>

  <!-- Row 2 -->
  <g transform="translate(30,166)"><g class="pill" style="animation-delay:.75s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#22D3EE"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Python</text></g></g>
  <g transform="translate(242,166)"><g class="pill" style="animation-delay:.9s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#8B5CF6"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Go</text></g></g>
  <g transform="translate(454,166)"><g class="pill" style="animation-delay:1.05s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#E15FD0"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">MongoDB</text></g></g>
  <g transform="translate(666,166)"><g class="pill" style="animation-delay:1.2s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#3B82FF"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">ReactJS</text></g></g>
  <g transform="translate(878,166)"><g class="pill" style="animation-delay:1.35s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#22D3EE"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Node.js</text></g></g>

  <!-- Row 3 -->
  <g transform="translate(30,228)"><g class="pill" style="animation-delay:1.5s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#8B5CF6"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Supabase</text></g></g>
  <g transform="translate(242,228)"><g class="pill" style="animation-delay:1.65s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#E15FD0"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Firebase</text></g></g>
  <g transform="translate(454,228)"><g class="pill" style="animation-delay:1.8s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#3B82FF"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">SQL</text></g></g>
  <g transform="translate(666,228)"><g class="pill" style="animation-delay:1.95s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#22D3EE"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Excel</text></g></g>
  <g transform="translate(878,228)"><g class="pill" style="animation-delay:2.1s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#8B5CF6"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">AWS</text></g></g>

  <!-- Row 4 -->
  <g transform="translate(30,290)"><g class="pill" style="animation-delay:2.25s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#E15FD0"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Power BI</text></g></g>
  <g transform="translate(242,290)"><g class="pill" style="animation-delay:2.4s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#3B82FF"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Tableau</text></g></g>
  <g transform="translate(454,290)"><g class="pill" style="animation-delay:2.55s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#22D3EE"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">Docker</text></g></g>
  <g transform="translate(666,290)"><g class="pill" style="animation-delay:2.7s"><rect width="196" height="44" rx="12" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/><circle class="dot" cx="22" cy="22" r="4" fill="#8B5CF6"/><text class="h" x="40" y="27" fill="#E6EDF7" font-size="15" font-weight="600">MySQL</text></g></g>
</svg>
