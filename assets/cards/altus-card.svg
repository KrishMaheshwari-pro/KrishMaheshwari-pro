<?xml version="1.0" encoding="UTF-8"?>
<!-- ALTUS CORP company card — identity + mission/vision/values panels. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img"
     aria-label="Altus Corp — Mumbai-based services and digital studio. Mission, vision and values.">
  <defs>
    <linearGradient id="al_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B1024"/><stop offset="100%" stop-color="#070A14"/></linearGradient>
    <linearGradient id="al_g" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#2E5BFF"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="al_glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2E5BFF" stop-opacity=".4"/><stop offset="100%" stop-color="#2E5BFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="al_rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E5BFF" stop-opacity="0"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity=".7"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <style>.h{font-family:'Segoe UI',system-ui,sans-serif}</style>
  </defs>

  <rect x="2" y="2" width="1096" height="356" rx="24" fill="url(#al_bg)" stroke="#1E2A45" stroke-width="1.5"/>
  <circle cx="180" cy="110" r="160" fill="url(#al_glow)"/>

  <!-- left identity -->
  <g class="h">
    <!-- emblem -->
    <g transform="translate(44,44)">
      <rect width="84" height="84" rx="22" fill="#0E1530" stroke="#22305A"/>
      <path d="M22 62 L42 26 L62 62" fill="none" stroke="url(#al_g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 62 L42 44 L52 62" fill="none" stroke="#8B5CF6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="42" cy="24" r="4" fill="#22D3EE"/>
    </g>
    <text x="148" y="78" fill="#F4F7FF" font-size="30" font-weight="800" letter-spacing="-.5">Altus Corp</text>
    <g transform="translate(148,96)">
      <circle cx="5" cy="6" r="4" fill="#22D3EE"/>
      <text x="18" y="11" fill="#9AA7C2" font-size="14" font-weight="600">Mumbai, India · Services &amp; digital studio</text>
    </g>
    <text x="44" y="176" fill="#C7D2E8" font-size="15.5" font-weight="500">Helping ambitious brands turn ideas into</text>
    <text x="44" y="200" fill="#C7D2E8" font-size="15.5" font-weight="500">well-crafted products, sites and systems.</text>

    <!-- meta chips -->
    <g transform="translate(44,232)" font-size="12.5" font-weight="600">
      <g><rect width="120" height="30" rx="15" fill="#11182E" stroke="#2A3A5E"/><text x="60" y="20" text-anchor="middle" fill="#C7D2E8">Founder-led</text></g>
      <g transform="translate(132,0)"><rect width="150" height="30" rx="15" fill="#11182E" stroke="#2A3A5E"/><text x="75" y="20" text-anchor="middle" fill="#C7D2E8">Consulting + Build</text></g>
      <g transform="translate(294,0)"><rect width="130" height="30" rx="15" fill="#11182E" stroke="#2A3A5E"/><text x="65" y="20" text-anchor="middle" fill="#C7D2E8">Client-first</text></g>
    </g>
    <text x="44" y="312" fill="#5E6B85" font-size="12">Krish Maheshwari · Founder — building the studio &amp; Productivity Shastra.</text>
  </g>

  <!-- vertical rule -->
  <line x1="560" y1="44" x2="560" y2="316" stroke="#1E2A45" stroke-width="1.5"/>

  <!-- right: mission / vision / values -->
  <g class="h" transform="translate(596,52)">
    <g>
      <rect width="460" height="78" rx="14" fill="#0E1530" stroke="#22305A"/>
      <rect width="4" height="78" rx="2" fill="#2E5BFF"/>
      <text x="22" y="30" fill="#22D3EE" font-size="12" font-weight="700" letter-spacing="1.5">MISSION</text>
      <text x="22" y="54" fill="#E6ECF7" font-size="14">Build software that respects people's time and</text>
      <text x="22" y="70" fill="#E6ECF7" font-size="14">makes good work feel effortless.</text>
    </g>
    <g transform="translate(0,92)">
      <rect width="460" height="78" rx="14" fill="#0E1530" stroke="#22305A"/>
      <rect width="4" height="78" rx="2" fill="#8B5CF6"/>
      <text x="22" y="30" fill="#22D3EE" font-size="12" font-weight="700" letter-spacing="1.5">VISION</text>
      <text x="22" y="54" fill="#E6ECF7" font-size="14">A studio whose products are quietly relied on</text>
      <text x="22" y="70" fill="#E6ECF7" font-size="14">by people who build for a living.</text>
    </g>
    <g transform="translate(0,184)">
      <rect width="460" height="78" rx="14" fill="#0E1530" stroke="#22305A"/>
      <rect width="4" height="78" rx="2" fill="#22D3EE"/>
      <text x="22" y="30" fill="#22D3EE" font-size="12" font-weight="700" letter-spacing="1.5">VALUES</text>
      <text x="22" y="54" fill="#E6ECF7" font-size="14">Craft over noise · Ship &amp; learn · Honesty with</text>
      <text x="22" y="70" fill="#E6ECF7" font-size="14">clients · Useful &gt; impressive.</text>
    </g>
  </g>
</svg>
