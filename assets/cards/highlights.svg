<?xml version="1.0" encoding="UTF-8"?>
<!-- HIGHLIGHTS · four big animated stat counters (real numbers from the portfolio).
     Self-contained, JavaScript-free. Glowing gradient numbers, drifting sparkles,
     sweeping shine, animated accent line. Dark card on transparent canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" width="1100" height="210" role="img"
     aria-label="Highlights: 3 internships, 15 plus projects built, 12 plus technologies, 4 domains">
  <defs>
    <linearGradient id="hl_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1024"/><stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="hl_blue"   x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3B82FF"/><stop offset="100%" stop-color="#67E8F9"/></linearGradient>
    <linearGradient id="hl_cyan"   x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#A7F3F9"/></linearGradient>
    <linearGradient id="hl_purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#E15FD0"/></linearGradient>
    <linearGradient id="hl_pink"   x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E15FD0"/><stop offset="100%" stop-color="#FBA4E0"/></linearGradient>
    <linearGradient id="hl_accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82FF" stop-opacity="0"/><stop offset="30%" stop-color="#8B5CF6"/><stop offset="60%" stop-color="#E15FD0"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="hl_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h{font-family:'Segoe UI',system-ui,sans-serif}
      .stat{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
      .s1{animation-delay:.10s}.s2{animation-delay:.25s}.s3{animation-delay:.40s}.s4{animation-delay:.55s}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .num{animation:glowPulse 3.4s ease-in-out infinite;transform-origin:center}
      .g1{animation-delay:0s}.g2{animation-delay:.45s}.g3{animation-delay:.9s}.g4{animation-delay:1.35s}
      @keyframes glowPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
      .spark{animation:floaty 5s ease-in-out infinite}
      .f2{animation-delay:.8s}.f3{animation-delay:1.6s}.f4{animation-delay:2.4s}.f5{animation-delay:3.2s}
      @keyframes floaty{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-9px);opacity:1}}
      @media (prefers-reduced-motion:reduce){.stat,.num,.spark{animation:none}}
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="206" rx="22" fill="url(#hl_bg)" stroke="#1E2A45" stroke-width="1.5"/>

  <!-- header + animated accent line -->
  <text class="h" x="40" y="46" fill="#F4F7FF" font-size="22" font-weight="800" letter-spacing="-.5">Highlights</text>
  <text class="h" x="170" y="46" fill="#7E8BA8" font-size="13">Built across AI/ML, full-stack, blockchain &amp; data — several as hackathon projects.</text>
  <rect x="40" y="60" width="1020" height="2" fill="url(#hl_accent)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting sparkles -->
  <circle class="spark f2" cx="300" cy="92" r="2.2" fill="#22D3EE"/>
  <circle class="spark f3" cx="560" cy="86" r="2"   fill="#8B5CF6"/>
  <circle class="spark f4" cx="820" cy="94" r="2.4" fill="#E15FD0"/>
  <circle class="spark f5" cx="980" cy="88" r="2"   fill="#3B82FF"/>

  <!-- vertical dividers -->
  <line x1="275" y1="86" x2="275" y2="186" stroke="#1E2A45" stroke-width="1.2"/>
  <line x1="550" y1="86" x2="550" y2="186" stroke="#1E2A45" stroke-width="1.2"/>
  <line x1="825" y1="86" x2="825" y2="186" stroke="#1E2A45" stroke-width="1.2"/>

  <!-- stat 1 -->
  <g class="h stat s1">
    <text class="num g1" x="137" y="150" text-anchor="middle" font-size="62" font-weight="800" fill="url(#hl_blue)" filter="url(#hl_glow)">3</text>
    <text x="137" y="178" text-anchor="middle" fill="#C7D2E8" font-size="15" font-weight="600">Internships</text>
  </g>
  <!-- stat 2 -->
  <g class="h stat s2">
    <text class="num g2" x="412" y="150" text-anchor="middle" font-size="62" font-weight="800" fill="url(#hl_cyan)" filter="url(#hl_glow)">15+</text>
    <text x="412" y="178" text-anchor="middle" fill="#C7D2E8" font-size="15" font-weight="600">Projects Built</text>
  </g>
  <!-- stat 3 -->
  <g class="h stat s3">
    <text class="num g3" x="687" y="150" text-anchor="middle" font-size="62" font-weight="800" fill="url(#hl_purple)" filter="url(#hl_glow)">12+</text>
    <text x="687" y="178" text-anchor="middle" fill="#C7D2E8" font-size="15" font-weight="600">Technologies</text>
  </g>
  <!-- stat 4 -->
  <g class="h stat s4">
    <text class="num g4" x="962" y="150" text-anchor="middle" font-size="62" font-weight="800" fill="url(#hl_pink)" filter="url(#hl_glow)">4</text>
    <text x="962" y="178" text-anchor="middle" fill="#C7D2E8" font-size="15" font-weight="600">Domains</text>
  </g>
</svg>
