<?xml version="1.0" encoding="UTF-8"?>
<!-- CORE CS FUNDAMENTALS · six animated tiles (DSA, OOP, DBMS, OS, CN, System Design).
     Self-contained, JavaScript-free. Staggered glow + entrance, travelling spark on the rule.
     Dark card on transparent canvas → reads on GitHub Dark and Light. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 248" width="1100" height="248" role="img"
     aria-label="Core CS fundamentals: Data Structures and Algorithms, Object-Oriented Programming, DBMS, Operating Systems, Computer Networks, System Design">
  <defs>
    <linearGradient id="cc_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1024"/><stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="cc_blue"   x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2E5BFF"/><stop offset="100%" stop-color="#5B8BFF"/></linearGradient>
    <linearGradient id="cc_cyan"   x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#67E8F9"/></linearGradient>
    <linearGradient id="cc_purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#B794FF"/></linearGradient>
    <linearGradient id="cc_pink"   x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E15FD0"/><stop offset="100%" stop-color="#F88FE0"/></linearGradient>
    <linearGradient id="cc_rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E5BFF" stop-opacity="0"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity=".85"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cc_spk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h{font-family:'Segoe UI',system-ui,sans-serif}
      /* tiles fade/slide in (backwards fill → visible even if animation is skipped),
         then breathe with a staggered glow. */
      .tile{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards, breathe 4.2s ease-in-out infinite}
      .e1{animation-delay:.10s,.10s}.e2{animation-delay:.20s,.55s}.e3{animation-delay:.30s,1.0s}
      .e4{animation-delay:.40s,1.45s}.e5{animation-delay:.50s,1.9s}.e6{animation-delay:.60s,2.35s}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.16)}}
      .badge{animation:pop 4.2s ease-in-out infinite;transform-origin:center}
      @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @media (prefers-reduced-motion:reduce){.tile,.badge{animation:none}}
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="244" rx="22" fill="url(#cc_bg)" stroke="#1E2A45" stroke-width="1.5"/>

  <!-- header -->
  <text class="h" x="36" y="50" fill="#F4F7FF" font-size="24" font-weight="800" letter-spacing="-.5">Core CS Fundamentals</text>
  <text class="h" x="36" y="74" fill="#7E8BA8" font-size="14">Strong foundations under everything I build — not just frameworks.</text>
  <line x1="36" y1="90" x2="1064" y2="90" stroke="url(#cc_rule)" stroke-width="1.5"/>
  <circle cx="0" cy="90" r="7" fill="url(#cc_spk)">
    <animate attributeName="cx" values="90;1010;90" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </circle>

  <!-- ── Row 1 ───────────────────────────────────────────── -->
  <!-- DSA -->
  <g class="h tile e1" transform="translate(28,110)">
    <rect width="338" height="56" rx="14" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/>
    <rect class="badge" x="14" y="11" width="34" height="34" rx="9" fill="url(#cc_blue)"/>
    <text x="31" y="33" text-anchor="middle" fill="#06080F" font-size="11" font-weight="800">DSA</text>
    <text x="60" y="27" fill="#F4F7FF" font-size="15" font-weight="700">Data Structures &amp; Algorithms</text>
    <text x="60" y="45" fill="#9AA7C2" font-size="12">Problem solving · complexity</text>
  </g>
  <!-- OOP -->
  <g class="h tile e2" transform="translate(381,110)">
    <rect width="338" height="56" rx="14" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/>
    <rect class="badge" x="14" y="11" width="34" height="34" rx="9" fill="url(#cc_cyan)"/>
    <text x="31" y="33" text-anchor="middle" fill="#06080F" font-size="11" font-weight="800">OOP</text>
    <text x="60" y="27" fill="#F4F7FF" font-size="15" font-weight="700">Object-Oriented Programming</text>
    <text x="60" y="45" fill="#9AA7C2" font-size="12">Design principles · SOLID</text>
  </g>
  <!-- DBMS -->
  <g class="h tile e3" transform="translate(734,110)">
    <rect width="338" height="56" rx="14" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/>
    <rect class="badge" x="14" y="11" width="34" height="34" rx="9" fill="url(#cc_purple)"/>
    <text x="31" y="33" text-anchor="middle" fill="#06080F" font-size="10" font-weight="800">DB</text>
    <text x="60" y="27" fill="#F4F7FF" font-size="15" font-weight="700">DBMS &amp; SQL</text>
    <text x="60" y="45" fill="#9AA7C2" font-size="12">Modelling · queries · indexing</text>
  </g>

  <!-- ── Row 2 ───────────────────────────────────────────── -->
  <!-- OS -->
  <g class="h tile e4" transform="translate(28,176)">
    <rect width="338" height="56" rx="14" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/>
    <rect class="badge" x="14" y="11" width="34" height="34" rx="9" fill="url(#cc_pink)"/>
    <text x="31" y="33" text-anchor="middle" fill="#06080F" font-size="11" font-weight="800">OS</text>
    <text x="60" y="27" fill="#F4F7FF" font-size="15" font-weight="700">Operating Systems</text>
    <text x="60" y="45" fill="#9AA7C2" font-size="12">Processes · memory · threads</text>
  </g>
  <!-- CN -->
  <g class="h tile e5" transform="translate(381,176)">
    <rect width="338" height="56" rx="14" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/>
    <rect class="badge" x="14" y="11" width="34" height="34" rx="9" fill="url(#cc_blue)"/>
    <text x="31" y="33" text-anchor="middle" fill="#06080F" font-size="11" font-weight="800">CN</text>
    <text x="60" y="27" fill="#F4F7FF" font-size="15" font-weight="700">Computer Networks</text>
    <text x="60" y="45" fill="#9AA7C2" font-size="12">TCP/IP · HTTP · the web</text>
  </g>
  <!-- System Design -->
  <g class="h tile e6" transform="translate(734,176)">
    <rect width="338" height="56" rx="14" fill="#0E1530" stroke="#22305A" stroke-width="1.2"/>
    <rect class="badge" x="14" y="11" width="34" height="34" rx="9" fill="url(#cc_cyan)"/>
    <text x="31" y="33" text-anchor="middle" fill="#06080F" font-size="11" font-weight="800">SD</text>
    <text x="60" y="27" fill="#F4F7FF" font-size="15" font-weight="700">System Design</text>
    <text x="60" y="45" fill="#9AA7C2" font-size="12">APIs · scaling · trade-offs</text>
  </g>
</svg>
