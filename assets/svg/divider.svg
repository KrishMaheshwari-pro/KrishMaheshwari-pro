<?xml version="1.0" encoding="UTF-8"?>
<!-- Section divider · slim gradient rule with a centred diamond and a travelling spark.
     Theme-neutral: the gradient fades to transparent at both ends so it sits cleanly
     on GitHub Dark and Light alike. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 32" width="1100" height="32" role="presentation">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2E5BFF" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#2E5BFF" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="0.95"/>
      <stop offset="72%"  stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <line x1="40" y1="16" x2="1060" y2="16" stroke="url(#dl)" stroke-width="1.5"/>
  <!-- centre diamond -->
  <g transform="translate(550,16)">
    <rect x="-6" y="-6" width="12" height="12" rx="2.5" fill="#0B1024" stroke="#8B5CF6" stroke-width="1.5" transform="rotate(45)"/>
    <rect x="-2.5" y="-2.5" width="5" height="5" rx="1" fill="#22D3EE" transform="rotate(45)"/>
  </g>
  <!-- travelling spark -->
  <circle cx="0" cy="16" r="9" fill="url(#spk)">
    <animate attributeName="cx" values="80;1020;80" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </circle>
</svg>
