<?xml version="1.0" encoding="UTF-8"?>
<!-- PRODUCTIVITY SHASTRA · system architecture (4 tiers).
     Layered diagram with a faint data "bus" between tiers and travelling flow dots. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img"
     aria-label="Productivity Shastra architecture: Experience, Application, Intelligence and Services, and Data tiers">
  <defs>
    <linearGradient id="ar_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B1024"/><stop offset="100%" stop-color="#070A14"/></linearGradient>
    <linearGradient id="ar_rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E5BFF" stop-opacity="0"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <linearGradient id="ar_t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#2E5BFF"/></linearGradient>
    <linearGradient id="ar_t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E5BFF"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="ar_t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="ar_t4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <style>
      .h{font-family:'Segoe UI',system-ui,sans-serif}
      .flow{animation:flow 3.4s linear infinite}
      .f2{animation-delay:1.1s}.f3{animation-delay:2.2s}
      @keyframes flow{0%{opacity:0;transform:translateY(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(372px)}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none;opacity:.5}}
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="596" rx="24" fill="url(#ar_bg)" stroke="#1E2A45" stroke-width="1.5"/>

  <!-- header -->
  <g class="h">
    <rect x="40" y="34" width="34" height="34" rx="9" fill="url(#ar_t2)"/>
    <path d="M50 51 l6 6 13 -13" fill="none" stroke="#06080F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="50" fill="#F4F7FF" font-size="22" font-weight="800" letter-spacing="-.3">Productivity Shastra — Architecture</text>
    <text x="86" y="72" fill="#7E8BA8" font-size="13">A modular productivity platform · Next.js front, typed API, AI engine, Postgres core.</text>
  </g>

  <!-- ── animated flow dots travelling down through the tiers ── -->
  <g>
    <circle class="flow"    cx="430" cy="118" r="3.5" fill="#22D3EE"/>
    <circle class="flow f2" cx="620" cy="118" r="3.5" fill="#8B5CF6"/>
    <circle class="flow f3" cx="810" cy="118" r="3.5" fill="#2E5BFF"/>
  </g>

  <!-- tier rails -->
  <line x1="210" y1="190" x2="1010" y2="190" stroke="url(#ar_rail)" stroke-width="1.5"/>
  <line x1="210" y1="314" x2="1010" y2="314" stroke="url(#ar_rail)" stroke-width="1.5"/>
  <line x1="210" y1="438" x2="1010" y2="438" stroke="url(#ar_rail)" stroke-width="1.5"/>

  <!-- tier label pills (left) -->
  <g class="h" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9AA7C2">
    <text x="40" y="150" >EXPERIENCE</text>
    <text x="40" y="274" >APPLICATION</text>
    <text x="40" y="398" >INTELLIGENCE</text>
    <text x="40" y="522" >DATA</text>
  </g>

  <!-- ── helper node look:  rounded glass box, accent bar, title, subtitle ── -->
  <!-- TIER 1 · Experience -->
  <g class="h">
    <g transform="translate(360,110)">
      <rect width="200" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t1)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">Web App</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Next.js · React · Tailwind</text>
    </g>
    <g transform="translate(600,110)">
      <rect width="200" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t1)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">Installable PWA</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Offline-first · push</text>
    </g>
  </g>

  <!-- TIER 2 · Application -->
  <g class="h">
    <g transform="translate(250,234)">
      <rect width="200" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t2)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">App Router / RSC</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Server components · edge</text>
    </g>
    <g transform="translate(480,234)">
      <rect width="200" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t2)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">REST API</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Node.js · Express · Zod</text>
    </g>
    <g transform="translate(710,234)">
      <rect width="200" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t2)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">AI Service</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Python · FastAPI</text>
    </g>
  </g>

  <!-- TIER 3 · Intelligence & Services -->
  <g class="h">
    <g transform="translate(210,358)">
      <rect width="186" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t3)"/>
      <text x="20" y="30" fill="#F4F7FF" font-size="14" font-weight="700">Auth &amp; RBAC</text>
      <text x="20" y="50" fill="#7E8BA8" font-size="12">Supabase Auth</text>
    </g>
    <g transform="translate(414,358)">
      <rect width="186" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t3)"/>
      <text x="20" y="30" fill="#F4F7FF" font-size="14" font-weight="700">AI Engine</text>
      <text x="20" y="50" fill="#7E8BA8" font-size="12">LangChain · OpenAI</text>
    </g>
    <g transform="translate(618,358)">
      <rect width="186" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t3)"/>
      <text x="20" y="30" fill="#F4F7FF" font-size="14" font-weight="700">Realtime</text>
      <text x="20" y="50" fill="#7E8BA8" font-size="12">Sync · presence</text>
    </g>
    <g transform="translate(822,358)">
      <rect width="186" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t3)"/>
      <text x="20" y="30" fill="#F4F7FF" font-size="14" font-weight="700">Jobs / Cron</text>
      <text x="20" y="50" fill="#7E8BA8" font-size="12">Queues · reminders</text>
    </g>
  </g>

  <!-- TIER 4 · Data -->
  <g class="h">
    <g transform="translate(300,482)">
      <rect width="190" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t4)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">PostgreSQL</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Supabase · Prisma</text>
    </g>
    <g transform="translate(520,482)">
      <rect width="190" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t4)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">Vector Store</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Embeddings · RAG</text>
    </g>
    <g transform="translate(740,482)">
      <rect width="190" height="66" rx="13" fill="#0E1530" stroke="#22305A"/><rect width="5" height="66" rx="2.5" fill="url(#ar_t4)"/>
      <text x="22" y="30" fill="#F4F7FF" font-size="15" font-weight="700">Object Storage</text>
      <text x="22" y="50" fill="#7E8BA8" font-size="12">Files · exports</text>
    </g>
  </g>
</svg>
