<?xml version="1.0" encoding="UTF-8"?>
<!-- ROADMAP / JOURNEY timeline — horizontal rail, alternating cards, animated progress fill. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img"
     aria-label="Roadmap: Foundations 2024, Productivity Shastra v1 2025, AI modules 2026, Public beta 2026, Scale beyond">
  <defs>
    <linearGradient id="rm_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B1024"/><stop offset="100%" stop-color="#070A14"/></linearGradient>
    <linearGradient id="rm_prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E5BFF"/><stop offset="55%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <style>
      .h{font-family:'Segoe UI',system-ui,sans-serif}
      /* end-state is the default so progress + pins always show, even unanimated */
      .grow{stroke-dasharray:600;stroke-dashoffset:180;animation:grow 2.4s cubic-bezier(.4,0,.2,1) .3s backwards}
      @keyframes grow{from{stroke-dashoffset:600}to{stroke-dashoffset:180}}
      .pin{animation:pin .5s ease backwards}
      .n1{animation-delay:.6s}.n2{animation-delay:1.1s}.n3{animation-delay:1.6s}.n4{animation-delay:2s}.n5{animation-delay:2.3s}
      @keyframes pin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.grow{stroke-dashoffset:180;animation:none}.pin{opacity:1;animation:none}}
    </style>
  </defs>
  <rect x="2" y="2" width="1096" height="316" rx="24" fill="url(#rm_bg)" stroke="#1E2A45" stroke-width="1.5"/>

  <text class="h" x="40" y="46" fill="#F4F7FF" font-size="22" font-weight="800" letter-spacing="-.3">The build journey</text>
  <text class="h" x="40" y="68" fill="#7E8BA8" font-size="13">From first commits to a productivity platform — and what's next.</text>

  <!-- base rail + animated progress -->
  <line x1="120" y1="178" x2="980" y2="178" stroke="#1E2A45" stroke-width="3" stroke-linecap="round"/>
  <line class="grow" x1="120" y1="178" x2="980" y2="178" stroke="url(#rm_prog)" stroke-width="3" stroke-linecap="round"/>

  <!-- nodes: x = 120,335,550,765,980 -->
  <g class="h">
    <!-- 1 done -->
    <g class="pin n1" style="transform-origin:120px 178px">
      <circle cx="120" cy="178" r="9" fill="#2E5BFF" stroke="#0B1024" stroke-width="3"/>
      <text x="120" y="128" text-anchor="middle" fill="#22D3EE" font-size="12" font-weight="700">2024</text>
      <text x="120" y="220" text-anchor="middle" fill="#F4F7FF" font-size="13" font-weight="700">Foundations</text>
      <text x="120" y="238" text-anchor="middle" fill="#7E8BA8" font-size="11">CS · first projects</text>
    </g>
    <!-- 2 done -->
    <g class="pin n2" style="transform-origin:335px 178px">
      <circle cx="335" cy="178" r="9" fill="#5B6BFF" stroke="#0B1024" stroke-width="3"/>
      <text x="335" y="128" text-anchor="middle" fill="#22D3EE" font-size="12" font-weight="700">2025</text>
      <text x="335" y="220" text-anchor="middle" fill="#F4F7FF" font-size="13" font-weight="700">Shastra v1</text>
      <text x="335" y="238" text-anchor="middle" fill="#7E8BA8" font-size="11">Internship build · ship</text>
    </g>
    <!-- 3 active -->
    <g class="pin n3" style="transform-origin:550px 178px">
      <circle cx="550" cy="178" r="11" fill="#8B5CF6" stroke="#0B1024" stroke-width="3"/>
      <circle cx="550" cy="178" r="17" fill="none" stroke="#8B5CF6" stroke-opacity="0.5">
        <animate attributeName="r" values="11;20;11" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="550" y="124" text-anchor="middle" fill="#22D3EE" font-size="12" font-weight="700">2026 · NOW</text>
      <text x="550" y="220" text-anchor="middle" fill="#F4F7FF" font-size="13" font-weight="700">AI modules</text>
      <text x="550" y="238" text-anchor="middle" fill="#7E8BA8" font-size="11">Smart planning · RAG</text>
    </g>
    <!-- 4 future -->
    <g class="pin n4" style="transform-origin:765px 178px">
      <circle cx="765" cy="178" r="8" fill="#0E1530" stroke="#3A4A6E" stroke-width="2.5"/>
      <text x="765" y="128" text-anchor="middle" fill="#5E6B85" font-size="12" font-weight="700">2026 H2</text>
      <text x="765" y="220" text-anchor="middle" fill="#C7D2E8" font-size="13" font-weight="700">Public beta</text>
      <text x="765" y="238" text-anchor="middle" fill="#5E6B85" font-size="11">Open sign-ups</text>
    </g>
    <!-- 5 future -->
    <g class="pin n5" style="transform-origin:980px 178px">
      <circle cx="980" cy="178" r="8" fill="#0E1530" stroke="#3A4A6E" stroke-width="2.5"/>
      <text x="980" y="128" text-anchor="middle" fill="#5E6B85" font-size="12" font-weight="700">FUTURE</text>
      <text x="980" y="220" text-anchor="middle" fill="#C7D2E8" font-size="13" font-weight="700">Scale</text>
      <text x="980" y="238" text-anchor="middle" fill="#5E6B85" font-size="11">Team &amp; platform</text>
    </g>
  </g>
</svg>
