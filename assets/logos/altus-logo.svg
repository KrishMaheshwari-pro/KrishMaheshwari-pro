<?xml version="1.0" encoding="UTF-8"?>
<!-- ALTUS CORP mark — "altus" (Latin: high / elevated).
     An ascending peak built from three rising strokes inside a rounded tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Altus Corp logo">
  <defs>
    <linearGradient id="a_g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E5BFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="a_tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1530"/><stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#a_tile)" stroke="#1E2A45" stroke-width="1.5"/>
  <!-- ascending peak -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 84 L60 36 L88 84" stroke="url(#a_g)" stroke-width="9"/>
    <path d="M46 84 L60 60 L74 84" stroke="#8B5CF6" stroke-width="7" opacity="0.85"/>
  </g>
  <circle cx="60" cy="33" r="5" fill="#22D3EE"/>
</svg>
