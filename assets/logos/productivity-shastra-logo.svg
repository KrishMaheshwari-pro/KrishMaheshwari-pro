<?xml version="1.0" encoding="UTF-8"?>
<!-- PRODUCTIVITY SHASTRA mark — "shastra" (Sanskrit: a body of knowledge / discipline).
     A focus ring (the system) opening into a forward checkmark (action shipped). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Productivity Shastra logo">
  <defs>
    <linearGradient id="ps_g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2E5BFF"/>
    </linearGradient>
    <linearGradient id="ps_tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1530"/><stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#ps_tile)" stroke="#1E2A45" stroke-width="1.5"/>
  <!-- focus ring with an opening (the discipline that lets work flow through) -->
  <path d="M60 24 a36 36 0 1 1 -25.5 10.6" fill="none" stroke="url(#ps_g)" stroke-width="9" stroke-linecap="round"/>
  <!-- forward check / motion -->
  <path d="M44 62 L56 74 L82 44" fill="none" stroke="#F4F7FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="24" r="5.5" fill="#22D3EE"/>
</svg>
