                M0,172 C170,188 330,150 500,170 C680,190 840,152 1010,172 C1130,182 1210,166 1280,172 L1280,220 L0,220 Z;
                M0,168 C170,150 330,186 500,170 C680,153 840,186 1010,170 C1130,158 1210,172 1280,166 L1280,220 L0,220 Z"/>
    </path>
    <path fill="url(#ft_w2)" opacity="0.14" d="M0,182 C190,166 360,196 540,182 C720,168 880,196 1060,182 C1150,175 1220,184 1280,180 L1280,220 L0,220 Z">
