<?xml version="1.0" encoding="UTF-8"?>
<!-- FOOTER banner — closing line over layered animated waves. Dark card, theme-neutral. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img"
     aria-label="Let's build something useful. Thanks for visiting.">
  <defs>
    <linearGradient id="ft_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B1024"/><stop offset="100%" stop-color="#070A14"/></linearGradient>
    <linearGradient id="ft_txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E5BFF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="ft_w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E5BFF"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient>
